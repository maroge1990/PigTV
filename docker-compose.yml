services:
  nodecast-tv:
    image: ghcr.io/technomancer702/nodecast-tv:latest
    build: https://github.com/technomancer702/nodecast-tv.git#main
    container_name: nodecast-tv
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      # DVR recordings - point this at wherever you want recorded shows stored
      - ./recordings:/app/recordings
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000 # Internal container port
