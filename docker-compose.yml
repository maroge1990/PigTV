services:
  pigtv:
    image: ghcr.io/maroge1990/pigtv:latest
    build: https://github.com/maroge1990/PigTV.git#main
    container_name: pigtv
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      # DVR recordings - point this at wherever you want recorded shows stored
      - ./recordings:/app/recordings
    tmpfs:
      # Live HLS session segments. RAM-backed rather than a bind mount:
      # a container restart can't resume a session anyway (see
      # sweepOrphanedCache in transcodeSession.js), so nothing here needs to
      # survive one, and this keeps it off the writable layer entirely
      # rather than just moving where on disk it lands. Sized well above
      # the ~360 MB/session the bounded segment list (90 x 4s) now caps
      # things at, for headroom across more than one session at once.
      - /app/transcode-cache:size=2g
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000 # Internal container port
      # Recording file names use the server's local time, and a container with no
      # TZ is on UTC. Set TZ in your shell or a .env file next to this file
      # (e.g. TZ=Australia/Sydney); it falls back to UTC, which is what you had
      # before.
      - TZ=${TZ:-UTC}
      # The server runs as this user, not root. Optional; the defaults are
      # Unraid's nobody:users. The recordings folder must be writable by it.
      # PUID=0 runs as root (escape hatch).
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
    # The image's own HEALTHCHECK (GET /api/health) applies; no override needed.
    # VAAPI: pass the GPU through (the entrypoint joins the device's group).
    # devices:
    #   - /dev/dri:/dev/dri
