name: Regression tests

# Pushes to main run these tests through docker-publish.yml, which calls this
# workflow and only publishes the image when it passes. Listing push here as
# well would run every test twice.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The tests need SQLite, not downloaded FFmpeg/ffprobe executables.
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm test
