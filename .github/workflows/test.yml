name: Regression tests

# Pull requests only. A push to main runs the suite once, inside the candidate image, in
# docker-publish.yml (#269, D-50), which publishes the image only when it passes.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # One source recipe/release for Linux tests and the production image.
      - uses: ./.github/actions/setup-media-tools
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      # Speed budgets are not part of the gate: a slow shared runner must not block an image
      # (test/helpers/perf.js). The perf job below runs them and reports.
      - run: npm test
        env:
          PIGTV_SKIP_PERF: '1'
      - run: bash scripts/verify-build.sh .

  perf:
    # Reports, never blocks: continue-on-error keeps a slow runner from failing the check.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: node --test test/channel-links-perf.test.js test/sports-fixtures.test.js test/sports-events.test.js test/sports-worker.test.js
