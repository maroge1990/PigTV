name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The tests need SQLite, not downloaded FFmpeg/ffprobe executables.
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: npm test
