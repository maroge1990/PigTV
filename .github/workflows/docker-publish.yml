name: Build and Publish Container Image

on:
  push:
    branches: [ main ]
    # A push that changes only docs builds nothing (D-38): no code, no image. Tags are not filtered.
    paths-ignore: [ 'docs/**', '**.md', '.github/ISSUE_TEMPLATE/**' ]
  # No tag or release trigger: :latest and :sha-* are for the rig. Production follows :release, which
  # only release.yml moves, on a v* tag or a manual run, to an image built here (#236).
  workflow_dispatch:

# One publishing run at a time, none cancelled: a partial test run trusts that its base commit was
# built green, which only holds if runs finish in push order (#269, D-50).
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  # One test run per push, inside the candidate image (the shipped Node 24, the pinned ffmpeg, UID 99),
  # then the image is published only if it passed (#269, D-50). Pull requests run test.yml instead.
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the diff of the push, for ci-test-plan.js

      # verify-build.sh requires modules from node_modules, and wants the shipped Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      # What tests can't check: placement, things that must not come back, the image, CI, markup.
      - name: Verify build
        run: bash scripts/verify-build.sh .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A partial test run is allowed only when the commit it diffs from has a published image, i.e.
      # it passed the full gate. Any doubt (no image, a registry error) means the full suite.
      - name: Check the base commit has a published image
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          exists=false
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BEFORE" =~ ^0+$ ]] \
              && docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pigtv:sha-${BEFORE:0:7}" > /dev/null 2>&1; then
            exists=true
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      # Which test files this push runs (D-50). Fails open: anything it cannot judge runs them all.
      - name: Plan the tests
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FORCED: ${{ github.event.forced }}
          BASE_IMAGE: ${{ steps.base.outputs.exists }}
        run: |
          node scripts/ci-test-plan.js --event "$EVENT" --base "$BEFORE" --head "$GITHUB_SHA" --forced "$FORCED" --base-image-exists "$BASE_IMAGE" --format github | tee -a "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Container image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pigtv
          # Never a release tag here (release.yml owns it). type=sha is what release.yml promotes.
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # Computed here rather than taken from the event payload: the workflow also runs
      # on workflow_dispatch, where the push-only fields are absent, and
      # the short SHA is what version.js renders into the badge.
      - name: Work out what is being built
        id: stamp
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - name: Build candidate without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: pigtv:candidate
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the image with the source it was built from. Without these the
          # Dockerfile's defaults apply and /api/version reports commit "dev", so the
          # only evidence of what is running is the build number - which is typed into
          # version.js by hand and therefore can be wrong. These cannot be.
          build-args: |
            PIGTV_COMMIT=${{ steps.stamp.outputs.commit }}
            PIGTV_BUILT_AT=${{ steps.stamp.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test the actual final runtime binaries/libs before any tag is published.
      # .github is excluded from the image; mount it for infrastructure contract tests.
      - name: Test candidate runtime
        env:
          TEST_FILES: ${{ steps.plan.outputs.files }}   # empty = the full suite
        run: |
          docker run --rm --entrypoint bash --user 99:100 \
            -e HOME=/tmp -e PIGTV_SKIP_PERF=1 -e TEST_FILES \
            --tmpfs /app/data:rw,uid=99,gid=100,mode=0700 \
            --tmpfs /app/transcode-cache:rw,uid=99,gid=100,mode=0700 \
            --tmpfs /app/recordings:rw,uid=99,gid=100,mode=0700 \
            -v "$GITHUB_WORKSPACE/.github:/app/.github:ro" \
            pigtv:candidate -c 'node scripts/check-media-tools.js --hardware && node scripts/check-encoder-options.js && { if [ -n "$TEST_FILES" ]; then node --test $TEST_FILES; else npm test; fi; }'

      - name: Publish validated candidate
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker tag pigtv:candidate "$image_tag"
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"

  # Reports, never blocks: speed budgets are not part of the gate (test/helpers/perf.js), so a slow
  # shared runner must not stop an image. It runs beside the build, so it adds no wait.
  perf:
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3
      - run: node --test test/channel-links-perf.test.js test/sports-fixtures.test.js test/sports-events.test.js test/sports-worker.test.js
