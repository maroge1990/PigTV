; Comskip tuning for PigTV
;
; Conservative by design. A false positive deletes programme content and is
; only discovered while watching; a missed advert is a mild irritation. So the
; thresholds below prefer under-detection, and should be relaxed only once you
; have seen how your own channels behave.
;
; Broadcasters differ considerably - logo position, whether breaks fade to
; black, typical break length - so treat this as a starting point rather than
; a finished configuration. Mount your own file over /app/config/comskip.ini
; to override it.

[Main Settings]
; Detection methods, summed as a bitmask:
;   1 black frame, 2 logo, 4 scene change, 8 resolution change,
;   16 closed captions, 32 aspect ratio, 64 silence, 128 cutscenes
; Black frame + logo + scene change + aspect + silence.
detect_method=103
verbose=1

; Australian commercial breaks are rarely shorter than 30s or longer than 5m.
; Anything outside that is more likely a false positive than a real break.
max_commercial_size=300
min_commercial_size=30
min_show_segment_length=120

[Detailed Settings]
; A "black" frame is rarely pure black after encoding.
max_brightness=60
test_brightness=40
max_avg_brightness=25

; Require a logo to be genuinely absent before treating it as a break: a
; momentary occlusion is not an advert.
logo_threshold=0.75
logo_filter=4
connect_blocks_with_logo=1

[Output Control]
; EDL is what PigTV reads: one line per break, start and end in seconds.
output_edl=1
output_default=0
output_txt=0
output_plist=0
